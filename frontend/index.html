<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle por Gestos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖐️ Gesture Controller</h1>
            <div id="status" class="status disconnected">Desconectado</div>
        </header>

        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="controls">
            <button id="btn-connect">Conectar Câmera</button>
            <p class="help-text">
                <strong>Gestos:</strong><br>
                ☝️ Indicador = Mover Mouse<br>
                🤏 Pinça = Clique<br>
                ✊ Punho = Arrastar (Segurar)<br>
                🖐️ Mão Aberta = Pausar<br>
                👆 Gesto "L" = Voltar
            </p>
        </div>
    </div>

    <!-- Biblioteca MediaPipe para rastreamento das mãos -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <!-- Biblioteca Socket.io para comunicação com o backend -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
